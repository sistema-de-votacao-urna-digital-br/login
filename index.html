<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Acesso do Operador - Urna Escolar</title><link rel="stylesheet" href="index.css"></head><body><div class="a"><div id="b"><h2>Autenticação do Operador</h2><form onsubmit="f(event)"><div class="c"><label for="d">Usuário do Operador:</label><input type="text" id="d" class="e" placeholder="Digite o usuário" required autocomplete="off"></div><div class="f"><label for="g">Senha do Operador:</label><input type="text" id="g" class="e" placeholder="Digite a senha" required autocomplete="off"></div><button type="submit" class="h">Entrar no Sistema</button></form></div><div id="i" class="j"><h2>Cadastrar Chave Mestra</h2><p class="k">Primeiro acesso detectado! Cadastre a Chave Mestra de 6 dígitos numéricos que será usada nas votações e resultados.</p><form onsubmit="l(event)"><div class="c"><label for="m">Nova Chave Mestra (6 números):</label><input type="text" id="m" class="e" maxlength="6" pattern="\d{6}" placeholder="Ex: 123456" required autocomplete="off"></div><button type="submit" class="h">Salvar e Criptografar Chave</button></form></div></div><script src="config.js"></script><script src="index.js"></script></body></html>
