<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Acesso do Operador - Urna Escolar</title><link rel="stylesheet" href="index.css"></head><body><div class="A"><div id="B"><h2>Autenticação do Operador</h2><form onsubmit="f(event)"><div class="C"><label for="D">Usuário do Operador:</label><input type="text" id="D" class="E" placeholder="Digite o usuário" required autocomplete="off"></div><div class="F"><label for="G">Senha do Operador:</label><input type="text" id="G" class="E" placeholder="Digite a senha" required autocomplete="off"></div><button type="submit" class="H">Entrar no Sistema</button></form></div><div id="I" class="J"><h2>Cadastrar Chave Mestra</h2><p class="K">Primeiro acesso detectado! Cadastre a Chave Mestra de 6 dígitos numéricos que será usada nas votações e resultados.</p><form onsubmit="l(event)"><div class="C"><label for="L">Nova Chave Mestra (6 números):</label><input type="text" id="L" class="E" maxlength="6" pattern="\d{6}" placeholder="Ex: 123456" required autocomplete="off"></div><button type="submit" class="H">Salvar e Criptografar Chave</button></form></div></div><script src="config.js"></script><script src="index.js"></script></body></html>
